echo [I] .ammo [0/1/2] Enables or disables infinite ammo, and in second clip.
echo [I] .kick <username> - Will kick a player from the server.
echo [I] .banplayer <username> - Will ban a player from the server.
echo [I] .ak / .ak47 - Gives AK47 regardless of team.
echo [I] .m4a4 - Gives M4A4 regardless of team.
echo [I] .m4 / m4a1  - Gives M4A1 regardless of team.
echo [I] .dm  - Starts deathmatch mode from .prac
echo [I] .god  - Activates god mode, making you invincible.
echo [I] .break - Breaks all breakable entities (e.g., glass windows, wooden doors, vents).
echo [I] .timer  - Starts and stops a timer, displaying the elapsed time.
echo [I] .solid - Toggles mp_solid_teammates.
echo [I] .impacts  - Toggles sv_showimpacts.
echo [I] .traj  - Toggles sv_grenade_trajectory_prac_pipreview. Disables camera.
echo [I] .wingman  - Starts wingman mode (exit by using .prac).
echo [I] .godbots  - Toggles invincibility bots.
echo [I] .ctspawn <number>  - Teleports you to the specified competitive spawn number for CT (Alias: .cts).
echo [I] .repair  - Repairs broken props: windows, doors, glasses, etc.
echo [I] .coloredsmokes  - Disables/Enables colored smokes in Practice Mode.
echo [I] .cbot <CT/T>  - Adds a crouchbot.
echo [I] .ctbot  -  Adds a ctbot.
echo [I] .tbot  - Adds a T side bot.
echo [I] .preview  - Trajectory Helper, simulate jumpthrows and W+jumpthrows
echo [I] .bot <ct/t> (optional)  - Spawns a bot at your current position.
echo [I] .clear  - Clears all active smokes, molotovs, and incendiaries.
echo [I] .nobots  - Removes all bots from the game.
echo [I] .dryrun <seconds>  - Activates dry-run mode (Alias: .dry).
echo [I] .spec  - Changes your team to spectator.
echo [I] .t <nickname>(optional) - Changes your team to T.
echo [I] .ct <nickname>(optional)  - Changes your team to CT.
echo [I] .crouchboost <ct/t> (optional)  - Spawns a crouched bot at your current position and boosts you on top of it.
echo [I] .boost <ct/t> (optional) - Spawns a bot at your current position and boosts you on top of it.
echo [I] .crouchbot <ct/t> (optional) - Spawns a crouched bot at your current position (Alias: .cbot).
echo [I] .fas - Forces all players into spectator mode except the one who issued this command (Alias: .watchme).
echo [I] .worsttspawn - Moves you to the farthest spawn point for the T team from your current location.
echo [I] .besttspawn - Moves you to the nearest spawn point for the T team from your current location.
echo [I] .worstctspawn - Moves you to the farthest spawn point for the CT team from your current location.
echo [I] .bestctspawn - Moves you to the nearest spawn point for the CT team from your current location.
echo [I] .worstspawn - Moves you to the farthest spawn point for your team from your current location.
echo [I] .bestspawn - Moves you to the nearest spawn point for your team from your current location.
echo [I] .tspawn <number> - Teleports you to the specified competitive spawn number for T (Alias: .ts).
echo [I] .spawn <number> - Teleports you to the specified competitive spawn number for your team.
echo [I] .noflash - Toggles flashbang immunity (Alias: .noblind).
echo [I] .fastforward - Fast-forwards the server time by 20 seconds (Alias: .ff).
echo [I] .savenade <name> <optional description (use \ for linebreak)> - Saves a grenade lineup (Alias: .sn).
echo [I] .rethrowdecoy - Rethrows your last decoy.
echo [I] .loadnade <name> - Loads a saved grenade lineup (Alias: .ln).
echo [I] .deletenade <name> - Deletes a saved grenade lineup (Alias: .dn).
echo [I] .importnade <code> - Imports a lineup using a code provided when saving it (Alias: .in).
echo [I] .editnade <name> - Add or edit the detonation position of the grenade.
echo [I] .throw <name> - Throws a grenade automatically.
echo [I] .hidenades - Hides the display of grenades across the map
echo [I] .shownades - Displays the saved grenades across the map using beams.
echo [I] .listnades <optional filter> - Lists all saved lineups or those matching a filter (Alias: .lin).
echo [I] .rethrow - Rethrows your last thrown grenade (Alias: .rt).
echo [I] .last - Teleports you back to the position where you threw your last grenade.
echo [I] .back <number> - Teleports you to a specified position in your grenade throw history.
echo [I] .delay <delay_in_seconds> - Sets a delay for your last grenade, used with .rethrow or .throwindex.
echo [I] .throwindex <index> <optional index> <optional index> Throws grenades from specified positions in your throw history.
echo [I] .lastindex - Displays the index number of your last thrown grenade.
echo [I] .rethrowsmoke - Rethrows your last smoke grenade.
echo [I] .rethrownade - Rethrows your last HE grenade.
echo [I] .rethrowflash - Rethrows your last flashbang.
echo [I] .rethrowmolotov - Rethrows your last molotov.
echo [I] .strats - Opens a .strats wizard where you can modify bot recordings, start replays, and dryruns.
echo [I] .createstrat <alias> - Creates a strategy where you add bot replays/recordings through the wizard.



