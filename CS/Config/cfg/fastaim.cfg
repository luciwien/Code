
alias .faon "bind r .resetbots;bind t bot_add;bind n .fa.free;bind m .fa.comp;bind mouse3 .pause;"
alias .fainf "exec see/fastaiminfo.cfg"
alias .fa.comp "sv_pausable 1;mp_restartgame 1;mp_freezetime 5;bot_kick;bot_quota 0;mp_roundtime 2; mp_damage_headshot_only true; mp_free_armor 1; mp_max_armor 1;"
alias .fa.free "sv_pausable 1;mp_restartgame 1;mp_freezetime 0;bot_kick;bot_quota 0;mp_roundtime 60; mp_damage_headshot_only true; mp_free_armor 1; mp_max_armor 1;"
alias .fa.cfg "sv_pausable 1;mp_restartgame 1;mp_freezetime 5;bot_kick;bot_quota 0;mp_roundtime 2; mp_damage_headshot_only true; mp_free_armor 1; mp_max_armor 1;"
  
alias .hsonly "toggle mp_damage_headshot_only"
alias .kev "cyclevar mp_free_armor 0 1 2"
alias .pause "pause;bind mouse3 .unpause"
alias .unpause "unpause; bind mouse3 .pause"
alias .resetbots "bot_quota 0; bot_kick;"
alias .usp "give weapon_usp_silencer"
alias .deag "give weapon_deagle"
alias .ak "give weapon_ak47"
alias .m4  "give weapon_m4a1_silencer"

echo [I] - Mouse 3 = pause
echo [I] - R = resetbots ::   T = bot_add
echo [I] - M = fa.comp -> roundtime 2 
echo [I] - N = .fa.free -> roundtime unendlich...
echo [I] - .fa.comp  :: .fa.free :: .fa.cfg
echo [I] - .hsonly ::  .kev :: .resetbots
echo [I] - .pause :: .unpause
echo [I] - .usp :: .deag :: .ak :: .m4

//since you cant do aliases in workshopmaps, the aliases have to be preloaded
