exec cfg\cleanup.cfg
bind mouse3 radio
//===== STANDARDS =====
bind r "+reload"
bind t "+spray_menu"
bind s "+back"
bind w "+forward"
bind d "+right"
bind a "+left"
bind e "+use"
bind g "drop"
bind SHIFT "+sprint"
bind CTRL "+duck"
bind f "+lookatweapon"
//bind h "switchhands"
bind b "buymenu"
bind SPACE "+jump"
bind MOUSE1 "+attack"
bind MOUSE2 "+attack2"
bind MOUSE4 "player_ping"
bind MOUSE5 "+voicerecord"
bind MWHEELUP "+jump"
bind MWHEELDOWN "+jump"
bind ESCAPE "cancelselect"
bind TAB "+showscores;+plrcnt"
bind PLUS "toggleconsole"
bind ] "toggleconsole"

//===== MOUSE =====
sensitivity "1.0"	
zoom_sensitivity_ratio 0.818933
bind MOUSE1 "+attack"
bind MOUSE2 "+attack2"
bind MOUSE5 "+voicerecord"
bind MWHEELDOWN "+jump"
bind MWHEELUP "+jump"
bind MOUSE4 "player_ping"

// === BASIC COMMANDS

bind space +jump
bind q +qsw
bind 1 slot1
bind 2 slot2
bind 3 slot3
bind 4 slot4
bind 5 slot5
alias slots "bind 1 slot1;bind 2 slot2;bind 3 slot3;bind 4 slot4;bind 5 slot5;"

// === INFOs ===
bind tab "+showscores"	
bind f "+lookatweapon"
bind t "+spray_menu"

//===== MESSAGING =====
bind k "roger"    //nonusbackslash <>
bind scancode53 "negative"  // ^ 
bind i "thanks"
bind h "switchhands"
bind scancode49 "messagemode2" // # scancode 49 
//scancode56 -> "--"
bind ENTER "messagemode"